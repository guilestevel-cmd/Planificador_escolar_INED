<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planificador Bimestral Escolar</title>
    <script src="https://tailwindcss.com"></script>
    <style>
        .bg-disponible { background-color: #def7ec; color: #03543f; }
        .bg-media { background-color: #fef08a; color: #713f12; }
        .bg-lleno { background-color: #e5e7eb; color: #374151; }
        @media print {
            body * { display: none; }
            #seccionImprimir, #seccionImprimir * { display: block; }
            #seccionImprimir { position: absolute; left: 0; top: 0; width: 100%; }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- LOGIN -->
    <div id="loginBox" class="max-w-md mx-auto mt-20 p-6 bg-white rounded-lg shadow-md">
        <h2 class="text-2xl font-bold mb-4 text-center text-blue-600">Planificador Escolar</h2>
        <input type="text" id="user" placeholder="Usuario" class="w-full p-2 border mb-3 rounded">
        <input type="password" id="pass" placeholder="Contraseña" class="w-full p-2 border mb-4 rounded">
        <button onclick="ejecutarLogin()" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700">Ingresar</button>
    </div>

    <!-- PANEL PRINCIPAL -->
    <div id="appContainer" class="hidden max-w-6xl mx-auto p-4">
        <header class="flex justify-between items-center mb-6 border-b pb-4">
            <div>
                <h1 class="text-3xl font-bold text-gray-900">Calendario Bimestral</h1>
                <p class="text-sm text-gray-500">Sesión: <span id="sesionNombre" class="font-bold"></span> (<span id="sesionRol"></span>)</p>
            </div>
            <button onclick="location.reload()" class="bg-red-500 text-white px-4 py-2 rounded text-sm">Salir</button>
        </header>

        <!-- MENÚ ROLES -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div id="adminPanel" class="hidden bg-white p-4 rounded-lg shadow border">
                <h3 class="font-bold text-lg mb-2 text-indigo-700">⚙️ Administración</h3>
                <button onclick="mostrarModalUser()" class="w-full bg-indigo-600 text-white p-2 rounded mb-2 text-sm">Crear Usuarios</button>
                <button onclick="mostrarModalUnidad()" class="w-full bg-purple-600 text-white p-2 rounded text-sm">Configurar Unidades</button>
            </div>
            <div class="bg-white p-4 rounded-lg shadow border flex flex-col justify-center">
                <label class="block font-medium mb-1 text-sm">Ver otro mes:</label>
                <input type="month" id="selectorMes" onchange="cargarCalendario()" class="p-2 border rounded">
            </div>
            <div class="bg-white p-4 rounded-lg shadow border flex flex-col justify-center">
                <label class="block font-medium mb-1 text-sm">Imprimir Reporte:</label>
                <select id="selectUnidadesReporte" class="p-2 border rounded mb-2"></select>
                <button onclick="generarReporte()" class="bg-green-600 text-white p-2 rounded text-sm hover:bg-green-700">Generar Lista Bimestral</button>
            </div>
        </div>

        <!-- CALENDARIO -->
        <div class="bg-white p-6 rounded-lg shadow">
            <div class="grid grid-cols-7 gap-2 text-center font-bold text-gray-600 mb-2">
                <div>Dom</div><div>Lun</div><div>Mar</div><div>Mié</div><div>Jue</div><div>Vie</div><div>Sáb</div>
            </div>
            <div id="calendarioGrid" class="grid grid-cols-7 gap-2 min-h-[400px]"></div>
        </div>
    </div>

    <!-- MODAL DETALLES -->
    <div id="modalDia" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-lg p-6 max-w-md w-full shadow-xl">
            <h3 id="modalFechaTitulo" class="text-xl font-bold mb-4"></h3>
            <div id="actividadesExistentes" class="mb-4 space-y-2 max-h-40 overflow-y-auto"></div>
            <div id="formularioActividad" class="border-t pt-4">
                <div class="mb-3">
                    <label class="block text-sm font-medium mb-1">Tipo de Actividad</label>
                    <select id="actTipo" class="w-full p-2 border rounded">
                        <option value="Profesor">Profesor (Tarea/Actividad)</option>
                        <option value="Comisión">Comisión (Institucional)</option>
                    </select>
                </div>
                <label class="block text-sm font-medium mb-1">Descripción</label>
                <textarea id="actDescripcion" class="w-full p-2 border rounded mb-3" placeholder="Escribe la descripción..."></textarea>
                <div class="flex justify-end space-x-2">
                    <button onclick="cerrarModal()" class="bg-gray-300 px-4 py-2 rounded">Cancelar</button>
                    <button onclick="guardarActividad()" class="bg-blue-600 text-white px-4 py-2 rounded">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- VISTA DE IMPRESIÓN -->
    <div id="seccionImprimir" class="hidden p-8">
        <h1 class="text-2xl font-bold text-center mb-2">Agenda de Actividades y Tareas Bimestrales</h1>
        <h3 id="printUnidadNombre" class="text-center text-lg mb-6 border-b pb-2"></h3>
        <table class="w-full border-collapse border border-gray-400">
            <thead>
                <tr class="bg-gray-100">
                    <th class="border border-gray-400 p-2 text-left">Fecha</th>
                    <th class="border border-gray-400 p-2 text-left">Tipo / Creador</th>
                    <th class="border border-gray-400 p-2 text-left">Descripción de la Actividad</th>
                </tr>
            </thead>
            <tbody id="tablaReporteCuerpo"></tbody>
        </table>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxeauudYv9NVRWMlw8eqnytW9Yl3KdC0sRyAw2-AMtdIXOV_ckRHNmLE08ofkvAcbOD0A/exec";
        let usuarioActual = null;
        let rolActual = null;
        let fechaSeleccionada = null;
        let baseDatosMes = {};

        const hoy = new Date();
        document.getElementById('selectorMes').value = `${hoy.getFullYear()}-${String(hoy.getMonth()+1).padStart(2,'0')}`;

        async function callAPI(payload) {
            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify(payload)
                });
                return await response.json();
            } catch (error) {
                console.error("Error en la conexión con la API:", error);
                alert("Error de conexión con el servidor escolar.");
            }
        }

        async function ejecutarLogin() {
            const u = document.getElementById('user').value;
            const p = document.getElementById('pass').value;
            const res = await callAPI({ action: "login", usuario: u, clave: p });
            if(res && res.success) {
                usuarioActual = res.usuario;
                rolActual = res.rol;
                document.getElementById('loginBox').classList.add('hidden');
                document.getElementById('appContainer').classList.remove('hidden');
                document.getElementById('sesionNombre').innerText = usuarioActual;
                document.getElementById('sesionRol').innerText = rolActual;
                if(rolActual === 'Administrador' || rolActual === 'Comisión') {
                    document.getElementById('adminPanel').classList.remove('hidden');
                }
                cargarCalendario();
                actualizarUnidadesReporte();
            } else {
                alert(res ? res.message : "Error al iniciar sesión");
            }
        }

        async function cargarCalendario() {
            const [year, month] = document.getElementById('selectorMes').value.split('-');
            const datos = await callAPI({ action: "obtenerDatosMes", year, month });
            if (datos) {
                baseDatosMes = datos;
                renderizarDias(parseInt(year), parseInt(month) - 1);
            }
        }

        function renderizarDias(year, month) {
            const grid = document.getElementById('calendarioGrid');
            grid.innerHTML = '';
            const primerDia = new Date(year, month, 1).getDay();
            const totalDias = new Date(year, month + 1, 0).getDate();
            
            for(let i=0; i<primerDia; i++) {
                grid.appendChild(document.createElement('div'));
            }
            
            for(let dia=1; dia<=totalDias; dia++) {
                const celda = document.createElement('div');
                const mesPad = String(month+1).padStart(2,'0');
                const diaPad = String(dia).padStart(2,'0');
                const llaveFecha = `${year}-${mesPad}-${diaPad}`;
                
                celda.className = "border rounded p-2 cursor-pointer h-20 flex flex-col justify-between transition-colors";
                celda.innerHTML = `<span class="font-bold text-sm">${dia}</span>`;
                
                let info = baseDatosMes[llaveFecha];
                if(!info) {
                    celda.classList.add('bg-disponible');
                } else if(info.comision) {
                    celda.classList.add('bg-lleno');
                    celda.innerHTML += `<span class="text-[10px] bg-red-200 px-1 rounded block truncate">Comisión</span>`;
                } else if(info.tareas >= 5) {
                    celda.classList.add('bg-lleno');
                    celda.innerHTML += `<span class="text-[10px] text-center font-semibold block">Lleno (5)</span>`;
                } else if(info.tareas >= 3) {
                    celda.classList.add('bg-media');
                    celda.innerHTML += `<span class="text-[10px] block">${info.tareas} tareas</span>`;
                } else {
                    celda.classList.add('bg-disponible');
                    celda.innerHTML += `<span class="text-[10px] block">${info.tareas} tareas</span>`;
                }
                
                celda.onclick = () => abrirDia(llaveFecha);
                grid.appendChild(celda);
            }
        }

        function abrirDia(fecha) {
            fechaSeleccionada = fecha;
            document.getElementById('modalFechaTitulo').innerText = `Actividades del: ${fecha}`;
            const contenedor = document.getElementById('actividadesExistentes');
            contenedor.innerHTML = '';
            
            let info = baseDatosMes[fecha];
            if(info && info.detalles.length > 0) {
                info.detalles.forEach(act => {
                    contenedor.innerHTML += `
                        <div class="p-2 border rounded bg-gray-100 text-xs">
                            <strong class="text-blue-700">[${act.tipo}] (${act.creador}):</strong> ${act.descripcion}
                        </div>`;
                });
            } else {
                contenedor.innerHTML = '<p class="text-sm text-gray-500 italic">No hay actividades registradas.</p>';
            }
            document.getElementById('modalDia').classList.remove('hidden');
        }

        function cerrarModal() {
            document.getElementById('modalDia').classList.add('hidden');
            document.getElementById('actDescripcion').value = '';
        }

        async function guardarActividad() {
            const desc = document.getElementById('actDescripcion').value;
            const tipo = document.getElementById('actTipo').value;
            if(!desc.trim()) return alert("Escribe una descripción");

            const res = await callAPI({
                action: "agregarActividad",
                fecha: fechaSeleccionada,
                tipo: tipo,
                creador: usuarioActual,
                descripcion: desc
            });

            if(res && res.success) {
                alert(res.message);
                cerrarModal();
                cargarCalendario();
            } else {
                alert(res ? res.message : "Error al registrar la actividad");
            }
        }

        async function actualizarUnidadesReporte() {
            const unidades = await callAPI({ action: "obtenerUnidades" });
            const select = document.getElementById('selectUnidadesReporte');
            select.innerHTML = '';
            if(unidades && unidades.length > 0) {
                unidades.forEach(u => {
                    select.innerHTML += `<option value="${u.inicio}|${u.fin}">${u.nombre} (${u.inicio} al ${u.fin})</option>`;
                });
            } else {
                select.innerHTML = `<option value="">No hay unidades configuradas</option>`;
            }
        }

        async function generarReporte() {
            const val = document.getElementById('selectUnidadesReporte').value;
            if(!val) return alert("Selecciona una unidad válida");
            const [inicio, fin] = val.split('|');
            
            const unidades = await callAPI({ action: "obtenerUnidades" });
            const selectUnidadObj = document.getElementById('selectUnidadesReporte');
            const nombreUnidadTexto = selectUnidadObj.options[selectUnidadObj.selectedIndex].text;
            
            const reporte = await callAPI({ action: "obtenerReporteBimestre", inicio, fin });
            const tbody = document.getElementById('tablaReporteCuerpo');
            tbody.innerHTML = '';
            
            if(reporte && reporte.length > 0) {
                reporte.forEach(r => {
                    tbody.innerHTML += `
                        <tr>
                            <td class="border border-gray-400 p-2">${r.fecha}</td>
                            <td class="border border-gray-400 p-2 font-semibold">[${r.tipo}]<br><span class="text-xs text-gray-600">${r.creador}</span></td>
                            <td class="border border-gray-400 p-2">${r.descripcion}</td>
                        </tr>`;
                });
                document.getElementById('printUnidadNombre').innerText = nombreUnidadTexto;
                window.print();
            } else {
                alert("No hay actividades registradas en este rango de fechas.");
            }
        }

        function mostrarModalUser() {
            let nuevoUser = prompt("Ingrese el nombre del nuevo usuario:");
            if(!nuevoUser) return;
            let nuevaClave = prompt("Ingrese la contraseña:");
            if(!nuevaClave) return;
            let nuevoRol = prompt("Ingrese el rol (Administrador, Comisión, Profesor):");
            if(!nuevoRol) return;

            callAPI({ action: "crearUsuario", nuevoUser, nuevaClave, nuevoRol }).then(res => {
                alert(res ? res.message : "Usuario creado");
            });
        }

        function mostrarModalUnidad() {
            let nombre = prompt("Nombre de la Unidad (ej. Unidad 1):");
            if(!nombre) return;
            let inicio = prompt("Fecha de inicio (YYYY-MM-DD):");
            if(!inicio) return;
            let fin = prompt("Fecha de fin (YYYY-MM-DD):");
            if(!fin) return;

            callAPI({ action: "guardarUnidad", nombre, inicio, fin }).then(res => {
                alert(res ? res.message : "Unidad guardada");
                actualizarUnidadesReporte();
            });
        }
    </script>
</body>
</html>
